name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Fork pull requests are excluded because this job installs and executes
    # the local-agent dependency set; same-repository PRs run on an ephemeral
    # Windows VM so stale local processes cannot affect verification.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Windows runner preflight
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw "ffprobe is required on the Windows runner" }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "ffmpeg is required on the Windows runner" }
          $pythonVersion = & python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ([version]$pythonVersion -lt [version]'3.11') { throw "Python 3.11+ is required; found $pythonVersion" }
          $nodeVersion = (& node --version).TrimStart('v')
          if ([version]$nodeVersion -lt [version]'20.0') { throw "Node 20+ is required; found $nodeVersion" }
          python --version
          node --version
          npm --version
          ffprobe -version | Select-Object -First 1

      - name: npm ci
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Install agent deps + pose model
        working-directory: apps/agent
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $model = "models/pose_landmarker_full.task"
          if (-not (Test-Path $model)) {
            Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task" -OutFile $model
          }

      - name: Clean web test port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $listeners = @(Get-NetTCPConnection -LocalPort 3101 -State Listen -ErrorAction SilentlyContinue)
          foreach ($listener in $listeners) {
            $process = Get-Process -Id $listener.OwningProcess -ErrorAction SilentlyContinue
            if ($process) {
              Stop-Process -Id $process.Id -Force
            }
          }
          Start-Sleep -Seconds 1
          if (Get-NetTCPConnection -LocalPort 3101 -State Listen -ErrorAction SilentlyContinue) {
            throw "Port 3101 is still occupied before the web test gate"
          }

      - name: Typecheck + web build + agent smoke + no-synthetic
        run: npm run verify

      - name: Start agent
        working-directory: apps/agent
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $dataDir = Join-Path $env:RUNNER_TEMP "bml-agent-data-$runKey-$([guid]::NewGuid().ToString('N'))"
          $pidFile = Join-Path $env:RUNNER_TEMP "bml-agent-process-$runKey.txt"
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $env:BML_AGENT_PORT = "$port"
          $env:BML_AGENT_URL = "http://127.0.0.1:$port"
          $env:BML_AGENT_DATA_DIR = $dataDir
          New-Item -ItemType Directory -Force -Path $env:BML_AGENT_DATA_DIR | Out-Null
          "BML_AGENT_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BML_AGENT_URL=$env:BML_AGENT_URL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BML_AGENT_DATA_DIR=$env:BML_AGENT_DATA_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BML_AGENT_PID_FILE=$pidFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $process = Start-Process -FilePath python -ArgumentList "main.py" -WorkingDirectory (Get-Location) -WindowStyle Hidden -PassThru
          $process.Id | Out-File -FilePath $pidFile -Encoding ascii
          $identity = Get-CimInstance Win32_Process -Filter "ProcessId = $($process.Id)"
          if (-not $identity -or $identity.CommandLine -notmatch "main\.py") {
            throw "Started agent process identity could not be verified"
          }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "$env:BML_AGENT_URL/health" -TimeoutSec 2
              if ($r.ok -and [int]$r.port -eq $port) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw "Agent failed to become healthy" }

      - name: Real fixture benchmarks
        run: npm run benchmark:fixtures
        env:
          BML_BENCH_MAX_FRAMES: "60"
          BML_BENCH_STRIDE: "3"

      - name: Validate readiness provenance
        run: npm run readiness:integrity

      - name: Stop test agent
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pidFile = $env:BML_AGENT_PID_FILE
          if ([string]::IsNullOrWhiteSpace($pidFile) -or -not (Test-Path $pidFile)) {
            Write-Host "No owned agent PID file was created"
            exit 0
          }
          $agentPid = [int](Get-Content -Raw -Path $pidFile).Trim()
          $identity = Get-CimInstance Win32_Process -Filter "ProcessId = $agentPid" -ErrorAction SilentlyContinue
          if (-not $identity) {
            Write-Host "Owned agent process $agentPid is already stopped"
            exit 0
          }
          if ($identity.CommandLine -notmatch "main\.py") {
            throw "Refusing to stop PID $agentPid because its command line is not the test agent"
          }
          Stop-Process -Id $agentPid -Force
          for ($i = 0; $i -lt 10; $i++) {
            if (-not (Get-Process -Id $agentPid -ErrorAction SilentlyContinue)) { exit 0 }
            Start-Sleep -Seconds 1
          }
          throw "Owned agent process $agentPid did not stop cleanly"
